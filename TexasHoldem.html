<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker - Casino Simulator</title>
    <link rel="icon" href="roulettefavicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="Styling/style.css">
    <link rel="stylesheet" href="Styling/TexasHoldem.css">
</head>
<body>
    <a class="return-home-badge" href="index.html" aria-label="Return to home">
        <img src="images/blue-curved-return-arrow.png" alt="Return to home">
    </a>
    <header class="casino-header">
        <h1>Texas Hold'em</h1>
        <div class="points-bar">Points: <span id="pointsValue">0</span></div>
    </header>

    <div class="game-container">
        <div class="info-panel">
            <div class="info-item">
                <span class="label">Pot</span>
                <span id="potAmountInfo" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Current Bet</span>
                <span id="currentBet" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Your Chips</span>
                <span id="playerChipsInfo" class="value">1000</span>
            </div>
            <div class="info-item">
                <span class="label">Status</span>
                <span id="gameStatus" class="value">Waiting…</span>
            </div>
        </div>

        <div class="poker-table">
            <div class="position dealer-position">
                <div class="player-name">Dealer</div>
                <div class="deck-display">
                    <div class="deck-stack"></div>
                    <div class="deck-label">Deck</div>
                </div>
                <div class="dealer-button">D</div>
            </div>

            <div class="position bot-position bot-position-1">
                <div class="player-name" id="botName1">Bot 1</div>
                <div class="player-cards" id="botCards1">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction1"></div>
                <div class="blind-indicator" id="botBlind1"></div>
                <div class="chip-stack" id="botChipStack1"><div class="chips-amount" id="botChips1">500</div></div>
            </div>

            <div class="position bot-position bot-position-2">
                <div class="player-name" id="botName2">Bot 2</div>
                <div class="player-cards" id="botCards2">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction2"></div>
                <div class="blind-indicator" id="botBlind2"></div>
                <div class="chip-stack" id="botChipStack2"><div class="chips-amount" id="botChips2">500</div></div>
            </div>

            <div class="position bot-position bot-position-3">
                <div class="player-name" id="botName3">Bot 3</div>
                <div class="player-cards" id="botCards3">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction3"></div>
                <div class="blind-indicator" id="botBlind3"></div>
                <div class="chip-stack" id="botChipStack3"><div class="chips-amount" id="botChips3">500</div></div>
            </div>

            <div class="position bot-position bot-position-4">
                <div class="player-name" id="botName4">Bot 4</div>
                <div class="player-cards" id="botCards4">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction4"></div>
                <div class="blind-indicator" id="botBlind4"></div>
                <div class="chip-stack" id="botChipStack4"><div class="chips-amount" id="botChips4">500</div></div>
            </div>

            <div class="position bot-position bot-position-5">
                <div class="player-name" id="botName5">Bot 5</div>
                <div class="player-cards" id="botCards5">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction5"></div>
                <div class="blind-indicator" id="botBlind5"></div>
                <div class="chip-stack" id="botChipStack5"><div class="chips-amount" id="botChips5">500</div></div>
            </div>

            <div class="position bot-position bot-position-6">
                <div class="player-name" id="botName6">Bot 6</div>
                <div class="player-cards" id="botCards6">
                    <div class="card card-back"></div>
                    <div class="card card-back"></div>
                </div>
                <div class="bot-action" id="botAction6"></div>
                <div class="blind-indicator" id="botBlind6"></div>
                <div class="chip-stack" id="botChipStack6"><div class="chips-amount" id="botChips6">500</div></div>
            </div>

            <div class="community-cards">
                <div class="community-card-label">Community Cards</div>
                <div class="cards-row">
                    <div class="card card-empty" id="communityCard1"></div>
                    <div class="card card-empty" id="communityCard2"></div>
                    <div class="card card-empty" id="communityCard3"></div>
                    <div class="card card-empty" id="communityCard4"></div>
                    <div class="card card-empty" id="communityCard5"></div>
                </div>
            </div>

            <div class="pot-display">
                <div class="pot-label">POT</div>
                <div class="pot-chips">
                    <div class="chip-stack-large">
                        <div class="pot-amount" id="potAmountChip">0</div>
                    </div>
                </div>
            </div>

            <div class="position player-position">
                <div class="player-name">You</div>
                <div class="player-cards" id="playerCards">
                    <div class="card card-empty" id="playerCard1"></div>
                    <div class="card card-empty" id="playerCard2"></div>
                </div>
                <div class="blind-indicator" id="playerBlind"></div>
                <div class="chip-stack" id="playerChipStack">
                    <div class="chips-amount" id="playerChipsDisplay">1000</div>
                </div>
            </div>
        </div>

        <div class="button-panel">
            <button class="action-button bet-btn"   id="betBtn"   disabled>BET</button>
            <button class="action-button check-btn" id="checkBtn" disabled>CHECK</button>
            <button class="action-button fold-btn"  id="foldBtn"  disabled>FOLD</button>
        </div>

        <div class="game-control-buttons">
            <button class="control-btn" id="startGameBtn">Start New Game</button>
            <button class="control-btn" id="resetGameBtn">Reset Game</button>
        </div>

        <div class="modal" id="betModal">
            <div class="modal-content">
                <h2>Enter Bet Amount</h2>
                <input type="number" id="betInput" placeholder="Enter amount" min="1">
                <div class="modal-buttons">
                    <button class="modal-btn" id="confirmBetBtn">Confirm</button>
                    <button class="modal-btn cancel" id="cancelBetBtn">Cancel</button>
                </div>
            </div>
        </div>

        <div id="gameMessage" class="game-message"></div>
    </div>

    <script src="js/PointsManager.js"></script>
    <script src="js/StatsManager.js"></script>
    <script src="js/AchievementsManager.js"></script>
    <script>initializeSharedPoints();</script>
    <script src="js/TexasHoldemEngine.js"></script>
</body>
</html>
