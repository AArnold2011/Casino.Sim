<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Casino Simulator</title>
    <link rel="icon" href="roulettefavicon.ico" type="image/x-icon"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styling/style.css">
    <link rel="stylesheet" href="Styling/Blackjack.css">
</head>
<body class="blackjack-page">
    <a class="return-home-badge" href="index.html" aria-label="Return to home">
        <img src="images/blue-curved-return-arrow.png" alt="Return to home">
    </a>
    <header class="casino-header">
        <h1>Blackjack - Casino Simulator</h1>
        <div class="points-bar">Points: <span id="pointsValue">0</span></div>
    </header>
    <main class="casino-main blackjack-layout">
    
        <section class="blackjack-table-wrap" aria-label="Blackjack table">
            <div class="blackjack-table">
                <div class="table-glow"></div>
                <div class="dealer-zone hand-zone">
                    <div class="hand-label">Dealer</div>
                    <div id="dealerCards" class="cards-row"></div>
                    <div class="hand-total">Total: <span id="dealerTotal">0</span></div>
                </div>
                <div class="player-zone hand-zone">
                    <div class="hand-label">Player</div>
                    <div id="playerCards" class="cards-row"></div>
                    <div class="hand-total">Total: <span id="playerTotal">0</span></div>
                </div>
                <div class="table-center-note">Stand on 17 rule</div>
            </div>
        </section>

        <section class="blackjack-controls game-card">
            <div class="controls-main-row">
                <div class="control-stack">
                    <label for="betAmount">Bet amount</label>
                    <input id="betAmount" type="number" min="1" step="1" value="25">
                </div>
                <div class="button-row">
                    <button id="dealBtn" class="action-button primary">Deal</button>
                    <button id="hitBtn" class="action-button" disabled>Hit</button>
                    <button id="standBtn" class="action-button" disabled>Stand</button>
                    <button id="newRoundBtn" class="action-button" disabled>New Round</button>
                </div>
                <div class="status-row">
                    <div>Current bet: <span id="currentBetValue">0</span></div>
                    <div>Dealer rule: stands on 17</div>
                </div>
                <p id="statusMessage" class="status-message">Place a bet and deal a hand.</p>
            </div>
        </section>

    </main>
    <script src="js/PointsManager.js"></script>
    <script src="js/StatsManager.js"></script>
    <script src="js/AchievementsManager.js"></script>
    <script>initializeSharedPoints();</script>
    <script src="js/BlackjackEngine.js"></script>
</body>
</html>
