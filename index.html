<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styling/index.css">
</head>
<body>

    <div id="titleScreen">
        <div class="title-inner">
            <div class="title-casino">Casino</div>
            <div class="title-sim">Simulator</div>
            <div class="title-divider"></div>
            <div class="title-prompt">Press any key to enter</div>
        </div>
    </div>

    <header class="floor-header">
        <div class="header-logo">Casino Simulator</div>
        <div class="header-right">
            <a class="header-stats" href="Stats.html" title="View stats &amp; achievements">
                <span class="header-stats-icon">📊</span>
                <span class="header-stats-net" id="headerNet">+0</span>
            </a>
            <div class="header-points">
                <div class="chip-icon"></div>
                Points:&nbsp;<span id="pointsValue">1000</span>
            </div>
        </div>
    </header>

    <section class="casino-floor">
        <div class="tables-scene">

            <div class="tables-row-top">

                <a class="game-table table-roulette" href="Roulette.html">
                    <div class="table-felt">
                        <div class="table-felt-label">Roulette</div>
                        <svg style="position:absolute;bottom:10px;right:20px;opacity:0.22;z-index:1;" width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="22" stroke="white" stroke-width="2"/>
                            <circle cx="24" cy="24" r="10" stroke="white" stroke-width="1.5"/>
                            <circle cx="24" cy="24" r="3" fill="white" opacity="0.6"/>
                            <line x1="24" y1="2" x2="24" y2="14" stroke="white" stroke-width="1.5"/>
                            <line x1="24" y1="34" x2="24" y2="46" stroke="white" stroke-width="1.5"/>
                            <line x1="2" y1="24" x2="14" y2="24" stroke="white" stroke-width="1.5"/>
                            <line x1="34" y1="24" x2="46" y2="24" stroke="white" stroke-width="1.5"/>
                            <line x1="7" y1="7" x2="15.5" y2="15.5" stroke="white" stroke-width="1.2"/>
                            <line x1="32.5" y1="32.5" x2="41" y2="41" stroke="white" stroke-width="1.2"/>
                            <line x1="41" y1="7" x2="32.5" y2="15.5" stroke="white" stroke-width="1.2"/>
                            <line x1="15.5" y1="32.5" x2="7" y2="41" stroke="white" stroke-width="1.2"/>
                        </svg>
                        <div class="table-chips">
                            <div class="mini-chip" style="background:#c0392b;"></div>
                            <div class="mini-chip" style="background:#2c3e50;"></div>
                            <div class="mini-chip" style="background:#018a18;"></div>
                            <div class="mini-chip" style="background:#c0392b;"></div>
                        </div>
                    </div>
                    <div class="table-name">Roulette</div>
                    <div class="table-min-bet">Min bet: 1 pt</div>
                </a>

                <a class="game-table table-blackjack" href="Blackjack.html">
                    <div class="table-felt">
                        <div class="table-felt-label">Blackjack</div>
                        <svg style="position:absolute;bottom:8px;left:50%;transform:translateX(-60%) rotate(-8deg);opacity:0.22;z-index:1;" width="28" height="40" viewBox="0 0 28 40">
                            <rect width="28" height="40" rx="3" fill="white"/>
                            <text x="4" y="14" font-size="10" fill="#c0392b" font-family="serif" font-weight="bold">A</text>
                            <text x="8" y="27" font-size="14" fill="#c0392b" font-family="serif">♥</text>
                        </svg>
                        <svg style="position:absolute;bottom:8px;left:50%;transform:translateX(10%) rotate(6deg);opacity:0.22;z-index:1;" width="28" height="40" viewBox="0 0 28 40">
                            <rect width="28" height="40" rx="3" fill="white"/>
                            <text x="4" y="14" font-size="10" fill="#111" font-family="serif" font-weight="bold">K</text>
                            <text x="8" y="27" font-size="14" fill="#111" font-family="serif">♠</text>
                        </svg>
                        <div class="table-chips">
                            <div class="mini-chip" style="background:#0066ff;"></div>
                            <div class="mini-chip" style="background:#00cc00;"></div>
                            <div class="mini-chip" style="background:#c0392b;"></div>
                        </div>
                    </div>
                    <div class="table-name">Blackjack</div>
                    <div class="table-min-bet">Min bet: 1 pt</div>
                </a>

                <a class="game-table table-texas" href="TexasHoldem.html">
                    <div class="table-felt">
                        <div class="table-felt-label">Texas<br>Hold'em</div>
                        <svg style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);opacity:0.2;z-index:1;" width="120" height="32" viewBox="0 0 120 32">
                            <rect x="0"   y="0" width="20" height="30" rx="2" fill="white"/>
                            <rect x="25"  y="0" width="20" height="30" rx="2" fill="white"/>
                            <rect x="50"  y="0" width="20" height="30" rx="2" fill="white"/>
                            <rect x="75"  y="0" width="20" height="30" rx="2" fill="white" opacity="0.5"/>
                            <rect x="100" y="0" width="20" height="30" rx="2" fill="white" opacity="0.3"/>
                        </svg>
                        <div class="table-chips">
                            <div class="mini-chip" style="background:#9900ff;"></div>
                            <div class="mini-chip" style="background:#ff8800;"></div>
                            <div class="mini-chip" style="background:#1a1a1a;"></div>
                            <div class="mini-chip" style="background:#00cc00;"></div>
                            <div class="mini-chip" style="background:#c0392b;"></div>
                        </div>
                    </div>
                    <div class="table-name">Texas Hold'em</div>
                    <div class="table-min-bet">Min bet: 1 pt</div>
                </a>

            </div>


            <div class="tables-row-bottom">

                <a class="game-table table-baccarat" href="Baccarat.html">
                    <div class="table-felt">
                        <div class="table-felt-label">Baccarat</div>
                        <div class="table-chips">
                            <div class="mini-chip" style="background:#ffff00;"></div>
                            <div class="mini-chip" style="background:#ff0099;"></div>
                            <div class="mini-chip" style="background:#664400;"></div>
                        </div>
                    </div>
                    <div class="table-name">Baccarat</div>
                    <div class="table-min-bet">Min bet: 1 pt</div>
                </a>

                <a class="game-table table-slots" href="Slots.html">
                    <div class="table-felt">
                        <div class="table-felt-label">Slots</div>
                        <svg style="position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);opacity:0.3;z-index:1;" width="100" height="52" viewBox="0 0 100 52">
                            <rect x="5"  y="4" width="25" height="44" rx="3" fill="none" stroke="#ffcc00" stroke-width="2"/>
                            <rect x="37" y="4" width="25" height="44" rx="3" fill="none" stroke="#ffcc00" stroke-width="2"/>
                            <rect x="69" y="4" width="25" height="44" rx="3" fill="none" stroke="#ffcc00" stroke-width="2"/>
                            <text x="10"  y="31" font-size="18" fill="#ffcc00">7</text>
                            <text x="42"  y="31" font-size="18" fill="#ffcc00">7</text>
                            <text x="74"  y="31" font-size="18" fill="#ffcc00">7</text>
                            <line x1="5" y1="26" x2="95" y2="26" stroke="#ff3333" stroke-width="1.5" opacity="0.8"/>
                        </svg>
                        <div class="table-chips" style="bottom:10px;">
                            <div class="mini-chip" style="background:#ffff00;"></div>
                            <div class="mini-chip" style="background:#ffff00;"></div>
                            <div class="mini-chip" style="background:#ffff00;"></div>
                        </div>
                    </div>
                    <div class="table-name">Slots</div>
                    <div class="table-min-bet">Min bet: 1 pt</div>
                </a>
            </div>
        </div>
    </section>

    <script src="js/PointsManager.js"></script>
    <script src="js/StatsManager.js"></script>
    <script src="js/AchievementsManager.js"></script>
    <script>
        if (typeof initializeSharedPoints === 'function') initializeSharedPoints();

        (function () {
            if (typeof StatsManager === 'undefined') return;
            var totals = StatsManager.getTotals();
            var el = document.getElementById('headerNet');
            if (el) {
                var net = totals.net;
                el.textContent = (net >= 0 ? '+' : '') + net;
                el.classList.add(net >= 0 ? 'net-pos' : 'net-neg');
            }
        })();

        (function() {
            var ts = document.getElementById('titleScreen');
            if (!ts) return;

            var referrer = document.referrer;
            var sameOrigin = false;
            try { sameOrigin = referrer && new URL(referrer).origin === location.origin; } catch(e){}

            if (sameOrigin) { ts.style.display = 'none'; return; }

            function dismiss() {
                ts.classList.add('hidden');
                setTimeout(() => ts.style.display = 'none', 850);
            }

            document.addEventListener('keydown', dismiss, { once: true });
            ts.addEventListener('click', dismiss, { once: true });
        })();
    </script>
</body>
</html>
